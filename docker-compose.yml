version: '3.8'

services:
  postgresdb:
    image: postgres:15
    container_name: project_postgres
    restart: always
    environment:
      POSTGRES_DB: task_management_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
