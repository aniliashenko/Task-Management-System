spring.application.name=tasksystem

# === PostgreSQL Connection ===
spring.datasource.url=jdbc:postgresql://localhost:5432/task_management_db
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# === Hibernate / JPA Settings ===
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security + Web
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

logging.level.com.example.tasksystem=DEBUG

# JJWT
logging.level.io.jsonwebtoken=DEBUG

dbx-access-token:${DROPBOX_ACCESS_TOKEN}
dbx-app-key:${DROPBOX_ACCESS_TOKEN}
dbx-app-secret:${DROPBOX_ACCESS_TOKEN}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
