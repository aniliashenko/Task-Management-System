databaseChangeLog:
  - changeSet:
      id: create-comments-table
      author: anton
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: time_stamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        # 🔗 Foreign key: comments.task_id → tasks.id
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_comments_task_id
            onDelete: CASCADE

        # 🔗 Foreign key: comments.user_id → users.id
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_comments_user_id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_comments_task_id
            tableName: comments
            columns:
              - column:
                  name: task_id

        - createIndex:
            indexName: idx_comments_user_id
            tableName: comments
            columns:
              - column:
                  name: user_id
