databaseChangeLog:
  - changeSet:
      id: create-attachments-table
      author: anton
      changes:
        - createTable:
            tableName: attachments
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: dropbox_file_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: upload_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: attachments
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_attachments_task_id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_attachments_task_id
            tableName: attachments
            columns:
              - column:
                  name: task_id
