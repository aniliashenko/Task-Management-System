databaseChangeLog:
  - changeSet:
      id: create-tasks-table
      author: anton
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(25)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE

              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: priority
                  type: VARCHAR(255)

              - column:
                  name: status
                  type: VARCHAR(255)

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        # 🔗 Foreign key to projects(id)
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_tasks_project_id
            onDelete: CASCADE

        # 🔗 Foreign key to users(id)
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_user_id
            onDelete: CASCADE

        - createIndex:
            indexName: idx_tasks_project_id
            tableName: tasks
            columns:
              - column:
                  name: project_id

        - createIndex:
            indexName: idx_tasks_user_id
            tableName: tasks
            columns:
              - column:
                  name: user_id
